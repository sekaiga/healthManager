<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8" />
  <link rel="shortcut icon"
    href="https://static-index-4gtuqm3bfa95c963-1304825656.tcloudbaseapp.com/official-website/favicon.svg"
    mce_href="https://static-index-4gtuqm3bfa95c963-1304825656.tcloudbaseapp.com/official-website/favicon.svg"
    type="image/x-icon" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous" />
  <title>图片上传与解析</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Droid Sans", "Helvetica Neue", "PingFang SC", "Hiragino Sans GB", "Droid Sans Fallback", "Microsoft YaHei", sans-serif;
    }

    .title-logo {
      width: 80px;
      height: 80px;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    @media screen and (min-width:1200px) {
      body .container {
        margin-top: 160px;
        margin-bottom: 272px;
      }
    }

    @media screen and (max-width:1919px) {
      body .container {
        margin-top: 76px;
        margin-bottom: 128px;
      }
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .count-button {
      width: 320px;
      height: 40px;
      box-sizing: border-box;
      margin: 16px 8px;
      font-weight: 500;
      font-size: 17px;
      color: #FFFFFF;
      letter-spacing: 1px;
      text-align: center;
      border-radius: 4px;
    }

    .count-number {
      align-self: flex-start;
      opacity: 0.9;
      font-weight: 500;
      font-size: 14px;
      color: #000000;
    }

    .count-reset {
      color: #576b95;
      cursor: pointer;
      margin-left: auto;
    }

    .count-text {
      width: 320px;
      height: 40px;
      padding: 0 12px;
      margin: 0 auto;
      line-height: 40px;
      text-align: left;
      display: flex;
      border: 1px solid rgba(0, 0, 0, 0.1);
      border-radius: 4px;
      opacity: 0.9;
      box-sizing: border-box;
      font-weight: 400;
      font-size: 14px;
      color: #000000;
    }

    .quote {
      font-size: 12px;
    }

    .qrcode {
      height: 144px;
      width: 144px;
      display: block;
      margin: 0 auto;
    }

    .title {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      width: 320px;
    }

    .title-text {
      width: 320px;
      height: 48px;
      text-align: center;
      margin-top: 16px;
      font-size: 32px;
      opacity: 0.9;
      font-weight: 500;
      font-size: 32px;
      color: #000000;
      letter-spacing: 0;
      line-height: 48px;
    }

    .counter-container {
      margin-top: 48px;
    }

    .hr {
      text-align: center;
      position: relative;
      z-index: 2;
      height: 20px;
      line-height: 20px;
    }

    .hr::after {
      position: absolute;
      content: '';
      top: 10px;
      left: 60px;
      width: 200px;
      border-bottom: 1px solid rgba(0, 0, 0, .1);
      z-index: -1;
    }

    .hr small {
      display: inline-block;
      background-color: white;
    }

    .hr-text {
      display: inline-block;
      height: 20px;
      font-weight: 400;
      font-size: 14px;
      color: rgba(0, 0, 0, 0.55);
      letter-spacing: 0;
      text-align: center;
      z-index: 2;
      background-color: white;
      padding: 0 8px;
      line-height: 20px;
    }

    .link-button {
      width: 154px;
      height: 48px;
      box-sizing: border-box;
      font-weight: 400;
      font-size: 14px;
      color: rgba(0, 0, 0, 0.90);
      letter-spacing: 0;
      text-align: center;
      background: rgba(0, 0, 0, 0.03);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      margin-top: 16px;
      width: 320px;
      height: 200px;
      box-sizing: border-box;
      border: 1px solid rgba(0, 0, 0, 0.10);
      border-radius: 5.71px;
      position: relative;
    }

    .card-text {
      text-align: center;
      font-weight: 400;
      font-size: 14px;
      color: rgba(0, 0, 0, 0.55);
      letter-spacing: 0;
    }

    .container {
      max-width: 800px;
      margin: 20px auto;
      padding: 20px;
    }

    .upload-section {
      text-align: center;
      margin-bottom: 30px;
      padding: 20px;
      border: 2px dashed #ddd;
      border-radius: 8px;
    }

    .results-section {
      margin-top: 30px;
    }

    .result-item {
      padding: 15px;
      margin-bottom: 15px;
      border: 1px solid #eee;
      border-radius: 5px;
    }

    .status-pending {
      color: #f0ad4e;
    }

    .status-completed {
      color: #5cb85c;
    }

    #previewArea {
      background-color: #f8f9fa;
      padding: 10px;
      border-radius: 4px;
    }

    #imagePreview {
      border: 1px solid #ddd;
      border-radius: 4px;
    }
  </style>
</head>

<body>
  <div class="container">
    <h2 class="text-center mb-4">图片上传与解析</h2>
    
    <div class="upload-section">
      <input type="file" id="fileInput" accept="image/*" style="display: none;">
      <button class="btn btn-primary me-2" onclick="document.getElementById('fileInput').click()">
        选择图片
      </button>
      <button id="uploadBtn" class="btn btn-success" style="display: none;" onclick="uploadSelectedImage()">
        上传图片
      </button>
      <div id="previewArea" class="mt-3" style="display: none;">
        <img id="imagePreview" style="max-width: 300px; max-height: 300px;" class="mb-2">
        <div class="small text-muted" id="fileName"></div>
      </div>
      <div id="uploadStatus" class="mt-2"></div>
    </div>

    <div class="results-section">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h4>解析结果</h4>
        <button class="btn btn-secondary" onclick="fetchResults()">刷新结果</button>
      </div>
      <div id="resultsList"></div>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script>
    let selectedFile = null;

    // 监听文件选择
    document.getElementById('fileInput').addEventListener('change', function(e) {
      if (e.target.files.length > 0) {
        selectedFile = e.target.files[0];
        // 显示预览
        const reader = new FileReader();
        reader.onload = function(e) {
          document.getElementById('imagePreview').src = e.target.result;
          document.getElementById('fileName').textContent = selectedFile.name;
          document.getElementById('previewArea').style.display = 'block';
          document.getElementById('uploadBtn').style.display = 'inline-block';
        };
        reader.readAsDataURL(selectedFile);
      }
    });

    // 上传选中的图片
    function uploadSelectedImage() {
      if (!selectedFile) {
        alert('请先选择图片');
        return;
      }

      const formData = new FormData();
      formData.append('file', selectedFile);

      $('#uploadStatus').html('<span class="text-info">上传中...</span>');
      $('#uploadBtn').prop('disabled', true);

      $.ajax({
        url: '/api/upload',
        type: 'POST',
        data: formData,
        processData: false,
        contentType: false,
        success: function(response) {
          $('#uploadStatus').html('<span class="text-success">上传成功</span>');
          // 重置选择状态
          selectedFile = null;
          document.getElementById('fileInput').value = '';
          document.getElementById('previewArea').style.display = 'none';
          document.getElementById('uploadBtn').style.display = 'none';
          fetchResults(); // 刷新结果列表
        },
        error: function(xhr) {
          $('#uploadStatus').html('<span class="text-danger">上传失败</span>');
        },
        complete: function() {
          $('#uploadBtn').prop('disabled', false);
        }
      });
    }

    // 获取解析结果
    function fetchResults() {
      $.get('/api/results', function(response) {
        if (response.code === 0 && response.data) {
          displayResults(response.data);
        }
      });
    }

    // 显示结果列表
    function displayResults(results) {
      const resultsList = $('#resultsList');
      resultsList.empty();

      results.forEach(function(item) {
        const statusClass = item.status === 2 ? 'status-completed' : 'status-pending';
        const statusText = item.status === 2 ? '解析完成' : '解析中';
        
        let html = `
          <div class="result-item">
            <div class="mb-2">
              <strong>状态：</strong>
              <span class="${statusClass}">${statusText}</span>
            </div>
        `;

        if (item.status === 2) {
          html += `
            <div>
              <strong>解析结果：</strong>
              <div class="mt-2">${item.parseResult}</div>
            </div>
          `;
        }

        html += '</div>';
        resultsList.append(html);
      });
    }

    // 页面加载时获取结果
    $(document).ready(function() {
      fetchResults();
    });
  </script>
</body>

</html>
